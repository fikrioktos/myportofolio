<button type="button"
        class="button button-danger"
        popovertarget="delete-project-{{ project.id }}"
        aria-label="Hapus {{ project.title }}"
        title="Hapus proyek">
    Hapus Proyek
</button>

<div id="delete-project-{{ project.id }}"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-project-title-{{ project.id }}">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-project-{{ project.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>

    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-project-{{ project.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">&times;</button>

        <h2 id="delete-project-title-{{ project.id }}">Hapus Proyek?</h2>
        <p>
            Apakah Anda yakin ingin menghapus
            <strong>{{ project.title }}</strong>?
        </p>

        <div class="project-delete-modal__actions">
            <form method="post" action="{% url 'main:delete_project' project.id %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="access-code-{{ project.id }}">Kode Akses</label>
                    <input type="password"
                           name="access_code"
                           id="access-code-{{ project.id }}"
                           placeholder="Kode rahasia portofolio"
                           required>
                    <p class="form-help">Hanya pemilik portofolio yang tahu kode ini.</p>
                </div>

                <div class="project-delete-modal__actions-buttons">
                    <button type="button"
                            class="button button-secondary"
                            popovertarget="delete-project-{{ project.id }}"
                            popovertargetaction="hide">Batal</button>
                    <button type="submit" class="button button-danger">Ya, Hapus</button>
                </div>
            </form>
        </div>
    </div>
</div>
