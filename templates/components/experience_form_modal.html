<div id="experience-form-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="experience-form-modal-title">
    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="experience-form-modal"
            popovertargetaction="hide"
            aria-label="Tutup form tambah experience"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="experience-form-modal"
                popovertargetaction="hide"
                aria-label="Tutup form tambah experience">×</button>

        <h2 id="experience-form-modal-title">Experience</h2>

        <form id="experience-form" class="project-form">
            <div class="form-group">
                <label for="experience-title">Posisi/Judul</label>
                <input type="text" id="experience-title" name="title" maxlength="255" required placeholder="Asisten Dosen PBP">
            </div>

            <div class="form-group">
                <label for="experience-role">Peran</label>
                <input type="text" id="experience-role" name="role" maxlength="255" required placeholder="Asisten Dosen">
            </div>

            <div class="form-group">
                <label for="experience-organization">Organisasi</label>
                <input type="text" id="experience-organization" name="organization" maxlength="255" placeholder="Fakultas Ilmu Komputer UI">
            </div>

            <div class="form-group">
                <label for="experience-description">Deskripsi Kegiatan</label>
                <textarea id="experience-description" name="description" rows="4" required placeholder="Ceritakan kegiatannya"></textarea>
            </div>

            <div class="form-group">
                <label for="experience-category">Kategori</label>
                <select id="experience-category" name="category" required>
                    {% for value, label in category_choices %}
                        <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="experience-thumbnail">URL Gambar (opsional)</label>
                <input type="url" id="experience-thumbnail" name="thumbnail" placeholder="https://contoh.com/foto.png">
            </div>

            <div class="form-group">
                <label for="experience-organization-url">Situs Organisasi (opsional)</label>
                <input type="url" id="experience-organization-url" name="organization_url" placeholder="https://cs.ui.ac.id">
            </div>

            <div class="form-group">
                <label for="experience-started-at">Tanggal Mulai</label>
                <input type="date" id="experience-started-at" name="started_at" required>
            </div>

            <div class="form-group">
                <label for="experience-ended-at">Tanggal Selesai (kosongkan jika masih berlangsung)</label>
                <input type="date" id="experience-ended-at" name="ended_at">
            </div>

            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="experience-form-modal"
                        popovertargetaction="hide">
                    Batal
                </button>

                <button type="submit" class="button" id="experience-form-submit">
                    Simpan
                </button>
            </div>
        </form>
    </div>
</div>
